<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <title>Quest Sorceress avatar alignment guide</title>
  <!-- Open this under a render at 800x1200 and line the head and feet up with
       the gold rules. Every figure and every item share this grid: it is the
       only reason a crown lands on a head instead of on an ear. -->
  <rect width="800" height="1200" fill="none" stroke="#c9a34e" stroke-width="3"/>
  <line x1="0" y1="216" x2="800" y2="216" stroke="#c9a34e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="12" y="208" font-family="sans-serif" font-size="20" fill="#c9a34e">Top of head · 18%</text>
  <line x1="0" y1="396" x2="800" y2="396" stroke="#c9a34e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="12" y="388" font-family="sans-serif" font-size="20" fill="#c9a34e">Chin · 33%</text>
  <line x1="0" y1="444" x2="800" y2="444" stroke="#c9a34e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="12" y="436" font-family="sans-serif" font-size="20" fill="#c9a34e">Shoulders · 37%</text>
  <line x1="0" y1="612" x2="800" y2="612" stroke="#c9a34e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="12" y="604" font-family="sans-serif" font-size="20" fill="#c9a34e">Waist · 51%</text>
  <line x1="0" y1="1092" x2="800" y2="1092" stroke="#c9a34e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="12" y="1084" font-family="sans-serif" font-size="20" fill="#c9a34e">Hem / ankles · 91%</text>
  <line x1="0" y1="1164" x2="800" y2="1164" stroke="#c9a34e" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="12" y="1156" font-family="sans-serif" font-size="20" fill="#c9a34e">Soles · 97%</text>
  <line x1="400" y1="0" x2="400" y2="1200" stroke="#6fd8c0" stroke-width="2" opacity="0.9"/>
  <line x1="336" y1="0" x2="336" y2="1200" stroke="#6fd8c0" stroke-width="2" opacity="0.45"/>
  <line x1="464" y1="0" x2="464" y2="1200" stroke="#6fd8c0" stroke-width="2" opacity="0.45"/>
  <line x1="304" y1="0" x2="304" y2="1200" stroke="#6fd8c0" stroke-width="2" opacity="0.45"/>
  <line x1="496" y1="0" x2="496" y2="1200" stroke="#6fd8c0" stroke-width="2" opacity="0.45"/>
  <text x="12" y="30" font-family="sans-serif" font-size="22" fill="#6fd8c0">800 x 1200 · 2:3 · transparent background</text>
</svg>
